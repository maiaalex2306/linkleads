name: CI

# Descarte pipelines substituídos por novos commits do mesmo PR.
# Evita consumo de runners e minutos em revisões obsoletas.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Tipos, testes unitários e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Dependências usadas no runtime: impedir distribuição com vulnerabilidade alta/crítica conhecida.
      - name: Auditar dependências de runtime
        run: npm audit --omit=dev --audit-level=high
      # A primeira operação após instalar deve funcionar sem dist pré-existente.
      - name: Testar workspace em checkout limpo
        run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Verificar sintaxe de todas as telas JavaScript
        run: |
          for file in apps/desktop/src/renderer/*.js; do
            node --check "$file" || exit 1
          done
      - name: Testar comparador visual e PNG
        run: node --test apps/desktop/e2e/visual-png.check.mjs

  e2e:
    name: E2E — ${{ matrix.name }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Campanha e sequência
            suite: "run sequence withdraw"
          - name: Decisão e integrações
            suite: "decision integrations"
          - name: Equipe e diagnóstico
            suite: "team diagnostics"
          - name: Prospecção e Sales Navigator
            suite: "prospecting salesnav salesnav-hash-resolution comment-duplicate profile-visit-scroll"
          - name: Curtir e comentar — ação única
            suite: "post-recognition comment-editor-fase4 unified-engagement comment-unconfirmed-fase4 approval-pending-fase7 salesnav-unified-engagement engagement-scroll"
          - name: Login e limites
            suite: "login limits"
          - name: Launcher e workspace por conta
            suite: "launcher-workspace session-persistence"
          - name: Interface guiada e falhas
            suite: "onboarding-guided simple explain ui-polish"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Preparar Electron e Playwright
        run: npx playwright install chromium
      - name: Executar fluxos Electron em site simulado
        run: |
          for t in ${{ matrix.suite }}; do
            echo "::group::E2E $t"
            xvfb-run -a node apps/desktop/e2e/$t.mjs || exit 1
            echo "::endgroup::"
          done
          if [[ "${{ matrix.name }}" == "Curtir e comentar — ação única" ]]; then
            LINKLEADS_E2E_MODERN_REACTION=1 xvfb-run -a node apps/desktop/e2e/engagement-scroll.mjs
          fi


  visual-regression:
    name: Regressão visual — 8 telas Electron comparadas com a main
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar e compilar versão candidata
        run: |
          npm ci
          npm run build
      - name: Preparar baseline do commit previamente aprovado
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          baseline="${PR_BASE:-${PUSH_BEFORE:-}}"
          if [[ -z "$baseline" || "$baseline" =~ ^0+$ ]]; then
            baseline="$(git rev-parse HEAD^1)"
          fi
          git cat-file -e "${baseline}^{commit}"
          git worktree add --detach "$RUNNER_TEMP/linkleads-visual-base" "$baseline"
          (
            cd "$RUNNER_TEMP/linkleads-visual-base"
            npm ci
            npm run build
          )
          echo "APP_BASE=$RUNNER_TEMP/linkleads-visual-base/apps/desktop" >> "$GITHUB_ENV"
          echo "BASE_SHA=$baseline" >> "$GITHUB_ENV"
      # Mudança funcional solicitada para configurações: aprovar baseline separado
      # SOMENTE da tela 03, enquanto as outras 7 continuam contra a main.
      # O SHA é imutável e registra a implementação revisada no PR #42.
      - name: Compilar referência visual imutável das novas abas
        shell: bash
        run: |
          set -euo pipefail
          approved=8cc10e1e9d7ceb5710ef4b113098ecab3013063f
          git cat-file -e "${approved}^{commit}"
          git worktree add --detach "$RUNNER_TEMP/linkleads-settings-approved" "$approved"
          (
            cd "$RUNNER_TEMP/linkleads-settings-approved"
            npm ci
            npm run build
          )
          echo "APP_SETTINGS_BASE=$RUNNER_TEMP/linkleads-settings-approved/apps/desktop" >> "$GITHUB_ENV"
          echo "SETTINGS_APPROVED_SHA=$approved" >> "$GITHUB_ENV"
      - name: Preparar bibliotecas gráficas do Electron
        run: npx playwright install chromium
      - name: Fotografar baseline e candidata e comparar pixels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-regression-report/base visual-regression-report/current visual-regression-report/diff
          echo "Versão aprovada: $BASE_SHA"
          xvfb-run -a node apps/desktop/e2e/visual-snapshots.mjs \
            --app-dir "$APP_BASE" --out "$PWD/visual-regression-report/base"
          xvfb-run -a node apps/desktop/e2e/visual-snapshots.mjs \
            --app-dir "$APP_SETTINGS_BASE" --out "$PWD/visual-regression-report/settings-reviewed"
          # Somente 03 recebe referência visual nova; demais 7 permanecem
          # vinculadas à main, detectando alterações não solicitadas.
          cp visual-regression-report/settings-reviewed/03-configuracoes-seguras.png \
            visual-regression-report/base/03-configuracoes-seguras.png
          echo "Nova referência da tela 03: $SETTINGS_APPROVED_SHA"
          xvfb-run -a node apps/desktop/e2e/visual-snapshots.mjs \
            --app-dir "$PWD/apps/desktop" --out "$PWD/visual-regression-report/current"
          # PR #58 removeu o menu global de quatro passos: mudança intencional
          # apenas na tela 04. O limite de 9% cobre o diff observado (7,48%).
          # Só é válido contra a main imediatamente anterior (PR #57).
          # Próximos commits voltam automaticamente ao limite padrão 0,6%.
          approved_layout=()
          if [[ "$BASE_SHA" == "444ed883802187f6645c09c8c600a58d9af1628a" || "$BASE_SHA" == "377c64934623051ff5846c4cf927ef28a043dca0" ]]; then
            approved_layout=(--approved-campaign-redesign "04-assistente-de-campanhas.png:0.09")
          fi
          node apps/desktop/e2e/compare-visual-snapshots.mjs \
            --baseline "$PWD/visual-regression-report/base" \
            --candidate "$PWD/visual-regression-report/current" \
            --diff "$PWD/visual-regression-report/diff" \
            --threshold 0.006 --channel-tolerance 25 "${approved_layout[@]}"
      - name: Preservar capturas e mapas de diferença para revisão
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LINKLEADS-Visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: visual-regression-report/
          if-no-files-found: warn
          retention-days: 14

  packaged:
    name: E2E da aplicação empacotada
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run bundle -w @linkleads/desktop
      - name: Testar aplicativo empacotado
        run: LINKLEADS_E2E_APP=$PWD/apps/desktop/app-dist xvfb-run -a node apps/desktop/e2e/run.mjs

  windows-homologator:
    name: Windows PowerShell 5.1 — homologação local
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar, tipar, testar e compilar via homologador Windows
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\homologar-linkleads.ps1 -SkipE2E -SkipBundle
      - name: Testar recuperacao de atalho em Windows isolado
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/test-shortcut-repair.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Reparador de atalho Windows reprovado' }
      - name: P0 — inventario e backup preservando dados em fixture Windows
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/test-baseline-preservation.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Inventario/backup LINKLEADS reprovado' }
      - name: Reproduzir teste do instalador no PowerShell 7 do workflow de producao
        shell: pwsh
        run: |
          npm test -w @linkleads/desktop
          if ($LASTEXITCODE -ne 0) { throw 'Teste do instalador reprovado no mesmo shell do workflow de producao' }

  windows-e2e-smoke:
    name: Windows Electron — interfaces e campanhas (sem NSIS)
    # O instalador oficial D:\LINKLEADS e homologado exclusivamente no
    # windows-portable-recovery.yml. Nao gerar o NSIS obsoleto aqui.
    needs: windows-homologator
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validar Electron real no Windows com dados isolados e site simulado
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($suite in @('onboarding-guided', 'session-persistence', 'unified-engagement', 'profile-visit-scroll', 'login', 'limits', 'decision', 'ui-polish')) {
            Write-Host "E2E Windows: $suite"
            & node "apps/desktop/e2e/$suite.mjs"
            if ($LASTEXITCODE -ne 0) { throw "E2E Windows reprovado: $suite (exit $LASTEXITCODE)" }
          }
