name: Windows - LinkLeads producao para teste do proprietario

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: owner-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-owner:
    name: Validar e gerar instalador Windows do app de producao
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias de forma reproduzivel
        run: npm ci
      - name: Auditar dependencias de runtime
        run: npm audit --omit=dev --audit-level=high
      - name: Testar, tipar e compilar
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Testes unitarios reprovados' }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'Typecheck reprovado' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Build reprovado' }
      - name: Empacotar canal de producao (testes do proprietario)
        shell: pwsh
        env:
          LINKLEADS_OWNER_TEST_BUILD: '1'
        run: |
          if ($env:LINKLEADS_PREVIEW_BUILD -eq '1') { throw 'Nao empacotar versao de avaliacao' }
          npm run bundle -w @linkleads/desktop
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao gerar bundle de producao' }
          $info = Get-Content 'apps/desktop/app-dist/build-info.json' -Raw | ConvertFrom-Json
          $expected = (git rev-parse --short HEAD).Trim()
          if ($info.channel -ne 'production') { throw "Canal inesperado: $($info.channel)" }
          if ($info.distribution -ne 'owner-production-test') { throw 'Bundle fora da distribuicao do proprietario' }
          if ($info.commit -ne $expected) { throw "Commit inesperado: $($info.commit)" }
          $app = Get-Content 'apps/desktop/app-dist/package.json' -Raw | ConvertFrom-Json
          if ($app.productName -ne 'LinkLeads') { throw 'Produto diferente da versao normal' }
          Write-Host "PRODUCAO | commit $expected | atualizacao automatica temporariamente desativada para teste"
      - name: Validar bundle Electron no Windows
        shell: pwsh
        run: |
          $env:LINKLEADS_E2E_APP = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/app-dist'
          foreach ($suite in @('onboarding-guided','session-persistence','login','unified-engagement','engagement-scroll','profile-visit-scroll','ui-polish')) {
            Write-Host "E2E Windows (bundle de producao): $suite"
            node "apps/desktop/e2e/$suite.mjs"
            if ($LASTEXITCODE -ne 0) { throw "E2E reprovado: $suite" }
          }
      - name: Fotografar oito telas do bundle Windows com dados ficticios
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $appDir = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/app-dist'
          $outDir = Join-Path $env:GITHUB_WORKSPACE 'visual-windows'
          node apps/desktop/e2e/visual-snapshots.mjs --app-dir "$appDir" --out "$outDir"
          if ($LASTEXITCODE -ne 0) { throw 'Capturas visuais Windows falharam' }
          $images = @(Get-ChildItem $outDir -Filter '*.png' -File)
          if ($images.Count -ne 8) { throw "Esperadas 8 capturas: recebidas $($images.Count)" }
          Write-Host "HOMOLOGADO: 8 screenshots de Windows sem conta real"
      - name: Gerar instalador Windows NSIS (identidade de producao)
        shell: pwsh
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          LINKLEADS_UPDATE_URL: https://github.com/maiaalex2306/linkleads/releases/latest/download
        run: |
          npx electron-builder --win nsis --x64 --publish never -c electron-builder.yml
          if ($LASTEXITCODE -ne 0) { throw 'Falha no empacotamento Windows' }
      - name: P0 — instalar NSIS, abrir EXE, reiniciar e comparar 8 telas
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content 'apps/desktop/package.json' -Raw | ConvertFrom-Json).version
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-installed-linkleads.ps1 `
            -InstallerPath "apps/desktop/release/LinkLeads-Setup-$version.exe" `
            -ExpectedVersion $version `
            -ReportDirectory "nsis-smoke" `
            -VisualBaselineDirectory "visual-windows"
          if ($LASTEXITCODE -ne 0) { throw "NSIS nao instalado ou nao abriu corretamente (exit $LASTEXITCODE)" }
          $installed = Get-Content 'nsis-smoke/nsis-install-report.json' -Raw | ConvertFrom-Json
          if ($installed.status -ne 'passed' -or -not $installed.runtimeSmoke -or -not $installed.installedVisualPassed -or -not $installed.desktopShortcutFound -or -not $installed.desktopShortcutTargetMatches) {
            throw 'Faltam provas obrigatorias da instalacao NSIS'
          }
      - name: Preparar atalho de instalacao assistida (duplo clique)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = 'scripts/INSTALAR-LINKLEADS.cmd'
          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) { throw 'Assistente CMD ausente' }
          $raw = Get-Content -LiteralPath $script -Raw
          if ($raw -match '(?i)Set-ExecutionPolicy|ExecutionPolicy\s+Bypass|DisableRealtimeMonitoring') {
            throw 'Assistente contem instrucao de enfraquecimento das protecoes Windows'
          }
          Copy-Item -LiteralPath $script -Destination 'apps/desktop/release/INSTALAR-LINKLEADS.cmd' -Force
          Write-Host 'Assistente Windows incluido ao lado do Setup e SHA256.txt'
      - name: Salvar diagnosticos de instalacao mesmo se falhar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LinkLeads-NSIS-Install-Smoke-${{ github.sha }}
          path: nsis-smoke/
          if-no-files-found: warn
          retention-days: 14
      - name: Validar artefato e registrar SHA-256
        shell: pwsh
        run: |
          $dir = 'apps/desktop/release'
          $files = @(Get-ChildItem $dir -Filter 'LinkLeads-Setup-*.exe' -File)
          if ($files.Count -ne 1) { throw "Esperado um instalador de producao: obtidos $($files.Count)" }
          if ($files[0].Length -lt 1000000) { throw 'Instalador incompleto' }
          if (-not (Test-Path -LiteralPath (Join-Path $dir 'INSTALAR-LINKLEADS.cmd'))) { throw 'Assistente de instalacao nao foi empacotado' }
          $hash = Get-FileHash $files[0].FullName -Algorithm SHA256
          $hashLine = "$($files[0].Name) SHA256 $($hash.Hash)"
          Set-Content -Path (Join-Path $dir 'SHA256.txt') -Value $hashLine -Encoding utf8
          $signature = Get-AuthenticodeSignature -FilePath $files[0].FullName
          $notes = @(
            'LinkLeads - instalador Windows do canal de producao para testes exclusivos do proprietario'
            "Commit: $env:GITHUB_SHA"
            "Arquivo: $($files[0].Name)"
            $hashLine
            'AppId: br.com.linkleads.app (mesma identidade da instalacao normal)'
            'Dados locais: utiliza contas, sessoes e SQLite da instalacao normal'
            'INSTALACAO SIMPLIFICADA: apos extrair o ZIP, abra INSTALAR-LINKLEADS.cmd por duplo clique.'
            'O assistente verifica SHA256, preserva backup, solicita Defender, abre o setup e grava resultado-instalacao.json.'
            'O instalador cria automaticamente um atalho LinkLeads na area de trabalho e no Menu Iniciar.'
            'ANTES DE INSTALAR: fechar o LinkLeads e fazer backup completo dos dados locais.'
            "Assinatura Windows: $($signature.Status). Se nao estiver Valid, NAO distribuir a clientes."
            'Atualizacao automatica desativada SOMENTE neste bundle, ate configurar feed HTTPS e assinatura.'
            'NAO e uma Release comercial publica. O instalador fica como artefato do GitHub Actions.'
            'Alertas de dependencias de desenvolvimento, incluindo Electron, ainda precisam de tratamento antes de distribuicao comercial.'
          )
          Set-Content -Path (Join-Path $dir 'LEIA-ME-INSTALACAO.txt') -Value $notes -Encoding utf8
          Write-Host $hashLine
          Write-Host "Assinatura: $($signature.Status) | teste do proprietario, nao distribuicao a clientes."
      - name: Verificar assistente CMD no Windows com instalador e hash reais
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & cmd.exe /c 'apps\desktop\release\INSTALAR-LINKLEADS.cmd' '--check-only'
          if ($LASTEXITCODE -ne 0) { throw "Assistente de instalacao rejeitou manifesto SHA256 (exit $LASTEXITCODE)" }
          Write-Host 'Assistente Windows: integridade validada sem desativar protecoes e sem executar setup'
          # Teste negativo: manifesto adulterado jamais pode aprovar uma instalacao.
          $badDir = Join-Path $env:RUNNER_TEMP ('LinkLeads-InvalidHash-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $badDir | Out-Null
          try {
            $realExe = @(Get-ChildItem 'apps/desktop/release' -Filter 'LinkLeads-Setup-*.exe' -File)
            if ($realExe.Count -ne 1) { throw 'Instalador ausente para teste negativo' }
            Copy-Item -LiteralPath $realExe[0].FullName -Destination $badDir -Force
            $badCmd = Join-Path $badDir 'INSTALAR-LINKLEADS.cmd'
            Copy-Item -LiteralPath 'apps/desktop/release/INSTALAR-LINKLEADS.cmd' -Destination $badCmd -Force
            $badHash = Join-Path $badDir 'SHA256.txt'
            Set-Content -LiteralPath $badHash -Value ($realExe[0].Name + ' SHA256 ' + ('0' * 64)) -Encoding ascii
            & $badCmd --check-only
            if ($LASTEXITCODE -eq 0) { throw 'FALHA DE SEGURANCA: assistente aceitou SHA256 adulterado' }
            Write-Host 'Assistente Windows: manifesto adulterado corretamente bloqueado'
            # A falha do comando adulterado e o resultado ESPERADO neste teste.
            # Limpar o codigo nativo somente DEPOIS de comprovar que foi rejeitado;
            # sem isso o pwsh encerra o job com exit 1, apesar de o teste passar.
            $global:LASTEXITCODE = 0
          } finally {
            Remove-Item -LiteralPath $badDir -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Disponibilizar instalador com hash e instrucoes
        uses: actions/upload-artifact@v4
        with:
          name: LinkLeads-Producao-Windows-${{ github.sha }}
          path: |
            apps/desktop/release/LinkLeads-Setup-*.exe
            apps/desktop/release/SHA256.txt
            apps/desktop/release/INSTALAR-LINKLEADS.cmd
            apps/desktop/release/LEIA-ME-INSTALACAO.txt
            visual-windows/*.png
            visual-windows/manifest.json
            nsis-smoke/nsis-install-report.json
            nsis-smoke/smoke-report.json
            nsis-smoke/installed-launcher.png
            nsis-smoke/visual-differences/report.json
          if-no-files-found: error
          retention-days: 30
