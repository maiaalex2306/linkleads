name: Windows - INSTALADOR OFICIAL D LINKLEADS
on:
  # Fase 8 P0: releases somente depois de TODOS os jobs CI passarem.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    branches: [fix/windows-portable-recovery-20261112, feature/phase3-identity-salesnav-20261112]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  portable-windows:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Confirmar o SHA efetivamente aprovado no CI
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) { throw "CI e instalador divergem: $actual vs $env:SOURCE_SHA" }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias e validar fonte
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci falhou' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Testes falharam' }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'Typecheck falhou' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Build falhou' }
      - name: Empacotar aplicativo para instalador fixo D LINKLEADS
        shell: pwsh
        env:
          LINKLEADS_OWNER_TEST_BUILD: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run bundle -w @linkleads/desktop
          if ($LASTEXITCODE -ne 0) { throw 'Bundle falhou' }
          Push-Location apps/desktop
          try {
            npx electron-builder --win dir --x64 --publish never -c electron-builder.yml
            if ($LASTEXITCODE -ne 0) { throw 'Empacotamento dir falhou' }
          } finally { Pop-Location }
          if (-not (Test-Path 'apps/desktop/release/win-unpacked/LinkLeads.exe')) { throw 'LinkLeads.exe ausente' }
      - name: Preparar Chromium para testes DOM reais em Windows
        shell: pwsh
        run: |
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Playwright Chromium ausente — gate P0 reprovado' }
      - name: Testar executavel portatil real (Windows, dados ficticios)
        shell: pwsh
        run: |
          $env:LINKLEADS_E2E_APP = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/app-dist'
          node apps/desktop/e2e/post-recognition.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Fase 7: matriz Renato/Douglas reprovada' }
          node apps/desktop/e2e/comment-editor-fase4.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Fase 7: editor ou submit desabilitado reprovado' }
          node apps/desktop/e2e/comment-unconfirmed-fase4.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Fase 7: reenvio incerto após reinício reprovado' }
          node apps/desktop/e2e/approval-pending-fase7.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Fase 7: comentário pendente/reinício reprovado' }
          node apps/desktop/e2e/session-persistence.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Persistencia isolada reprovada' }
          node apps/desktop/e2e/unified-engagement.mjs
          if ($LASTEXITCODE -ne 0) { throw 'E2E engagement reprovado' }
          node apps/desktop/e2e/salesnav-unified-engagement.mjs
          if ($LASTEXITCODE -ne 0) { throw 'E2E Sales Navigator, perfil, curtir e comentar reprovado' }
          node apps/desktop/e2e/salesnav-hash-resolution.mjs
          if ($LASTEXITCODE -ne 0) { throw 'E2E SN hash sem member_id reprovado no Windows' }
          $exe=(Resolve-Path 'apps/desktop/release/win-unpacked/LinkLeads.exe').Path
          if ((Get-Item $exe).Length -lt 1000000) { throw 'Exe aparentemente incompleto' }
          # Gate P0: processo existente nao basta; a janela principal do EXE
          # distribuido precisa abrir visivelmente com APPDATA temporario.
          node apps/desktop/e2e/portable-first-window.mjs $exe
          if ($LASTEXITCODE -ne 0) { throw 'Pacote Windows sem janela visivel - bloquear publicacao' }
          $sig=Get-AuthenticodeSignature $exe
          Write-Host "ASSINATURA: $($sig.Status) - apenas teste do proprietario"
      - name: Montar instalador unico e fixo D:\LINKLEADS
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path 'portable-package/LinkLeads' -Force | Out-Null
          Copy-Item -Path 'apps/desktop/release/win-unpacked/*' -Destination 'portable-package/LinkLeads' -Recurse -Force
          Copy-Item -LiteralPath 'scripts/INSTALAR-LINKLEADS.cmd' -Destination 'portable-package/INSTALAR-LINKLEADS.cmd'
          Copy-Item -LiteralPath 'scripts/ABRIR-LINKLEADS.cmd' -Destination 'portable-package/ABRIR-LINKLEADS.cmd'
          Copy-Item -LiteralPath 'docs/CONTRATO_PERFIS_POSTS_SALESNAV_20261113.md' -Destination 'portable-package/CONTRATO_IDENTIDADE_E_POSTS.md'
          $exe='portable-package/LinkLeads/LinkLeads.exe'
          if (-not (Test-Path $exe) -or -not (Test-Path 'portable-package/LinkLeads/resources/app.asar')) { throw 'Pacote Electron incompleto' }
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash
          $files=Get-ChildItem 'portable-package/LinkLeads' -Recurse -File
          [ordered]@{schema='linkleads.installer.fixed.v1';sha=$env:SOURCE_SHA;target='D:\LINKLEADS';exe='D:\LINKLEADS\APP\LinkLeads.exe';exeSha256=$hash;fileCount=$files.Count;totalBytes=($files | Measure-Object Length -Sum).Sum} | ConvertTo-Json | Set-Content 'portable-package/manifesto.json' -Encoding UTF8
          @(
            'LINKLEADS — INSTALACAO WINDOWS'
            'DESTINO PERMANENTE E OBRIGATORIO: D:\LINKLEADS'
            '1. Extraia o ZIP inteiro em qualquer pasta.'
            '2. Feche qualquer LinkLeads.exe anterior.'
            '3. Execute INSTALAR-LINKLEADS.cmd na raiz da pasta extraida.'
            '4. Use o atalho LinkLeads da area de trabalho.'
            'Aplicativo: D:\LINKLEADS\APP\LinkLeads.exe'
            'Diagnostico: D:\LINKLEADS\resultado-instalacao-linkleads.txt'
            'Nao exige backup, nao desinstala, nao exclui pastas e nao desativa antivirus.'
            'Esta entrega nao usa o instalador NSIS antigo.'
            'Conta LinkedIn real requer homologacao supervisionada; nao ha garantia de resolucao universal.'
          ) | Set-Content 'portable-package/LEIA-ME.txt' -Encoding UTF8
          foreach ($name in @('INSTALAR-LINKLEADS.cmd','ABRIR-LINKLEADS.cmd','manifesto.json')) {
            if (-not (Test-Path ("portable-package/" + $name))) { throw "Pacote sem $name na raiz" }
          }

      - name: Homologar instalador integral em D:\LINKLEADS e atalho real
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'D:\')) { throw 'Runner nao possui unidade D:' }
          $root = 'D:\LINKLEADS'
          $exe = Join-Path $root 'APP\LinkLeads.exe'
          $cmd = (Resolve-Path 'portable-package/INSTALAR-LINKLEADS.cmd').Path
          $sourceManifest = Get-Content 'portable-package/manifesto.json' -Raw | ConvertFrom-Json
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $marker = Join-Path $root 'campanha-preexistente-ci.txt'
          Set-Content -LiteralPath $marker -Value 'NUNCA APAGAR' -Encoding ascii
          $env:LINKLEADS_NONINTERACTIVE = '1'
          $env:LINKLEADS_PORTABLE_SMOKE = '1'
          $env:LINKLEADS_TEST_USER_DATA = Join-Path $env:RUNNER_TEMP 'linkleads-installer-userdata'
          New-Item -ItemType Directory -Force -Path $env:LINKLEADS_TEST_USER_DATA | Out-Null
          try {
            & $cmd
            if ($LASTEXITCODE -ne 0) { throw "Instalacao inicial retornou $LASTEXITCODE" }
            $report = Join-Path $root 'resultado-instalacao-linkleads.txt'
            if (-not (Test-Path $report)) { throw 'Relatorio do instalador ausente' }
            if ((Get-Content $report -Raw) -notmatch 'STATUS: INSTALADO_JANELA_OK') { throw "Instalador nao comprovou janela: $(Get-Content $report -Raw)" }
            if (-not (Test-Path $exe) -or -not (Test-Path (Join-Path $root 'ABRIR-LINKLEADS.cmd'))) { throw 'Binarios ou launcher ausentes no local fixo' }
            if ((Get-FileHash $exe -Algorithm SHA256).Hash -ne $sourceManifest.exeSha256) { throw 'SHA256 divergente apos instalacao' }
            if ((Get-Content $marker -Raw).Trim() -ne 'NUNCA APAGAR') { throw 'Arquivo preexistente foi alterado' }
            $desktop=[Environment]::GetFolderPath('DesktopDirectory')
            $link=Join-Path $desktop 'LinkLeads.lnk'
            if (-not (Test-Path $link)) { throw 'Atalho da area de trabalho ausente' }
            $shortcut=(New-Object -ComObject WScript.Shell).CreateShortcut($link)
            if ($shortcut.TargetPath -ine 'D:\LINKLEADS\ABRIR-LINKLEADS.cmd') { throw "Atalho incorreto: $($shortcut.TargetPath)" }
            Write-Host 'APROVADO: D:\LINKLEADS fixo, hash, atalho, dados preexistentes, janela visivel e relatorio'
            # Testar novamente o INSTALAR ja instalado em D:\LINKLEADS:
            # deve reparar e reabrir, sem depender do ZIP extraido.
            Get-CimInstance Win32_Process -Filter "Name = 'LinkLeads.exe'" -ErrorAction SilentlyContinue |
              Where-Object { $_.ExecutablePath -ieq $exe } |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 2
            $localInstaller = Join-Path $root 'INSTALAR-LINKLEADS.cmd'
            if (-not (Test-Path $localInstaller)) { throw 'Instalador nao ficou disponivel na raiz fixa' }
            & $localInstaller
            if ($LASTEXITCODE -ne 0) { throw "Reparo pela raiz D:\LINKLEADS falhou: $LASTEXITCODE" }
            $again = Get-Content $report -Raw
            if ($again -notmatch 'MODO: REPARO_SEM_COPIA' -or $again -notmatch 'STATUS: INSTALADO_JANELA_OK') {
              throw "Reparo nao comprovado: $again"
            }
            if ((Get-Content $marker -Raw).Trim() -ne 'NUNCA APAGAR') { throw 'Arquivo preexistente alterado durante o reparo' }
            Write-Host 'APROVADO: instalador da raiz funciona novamente sem ZIP nem perda de arquivos'
          } finally {
            if (Test-Path (Join-Path $root 'resultado-instalacao-linkleads.txt')) { Write-Host (Get-Content (Join-Path $root 'resultado-instalacao-linkleads.txt') -Raw) }
            if (Test-Path (Join-Path $root 'resultado-abertura-linkleads.txt')) { Write-Host (Get-Content (Join-Path $root 'resultado-abertura-linkleads.txt') -Raw) }
            # Apenas nesta maquina descartavel de CI, finalizar processo do EXE testado.
            Get-CimInstance Win32_Process -Filter "Name = 'LinkLeads.exe'" -ErrorAction SilentlyContinue |
              Where-Object { $_.ExecutablePath -ieq $exe } |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            Remove-Item Env:LINKLEADS_NONINTERACTIVE -ErrorAction SilentlyContinue
            Remove-Item Env:LINKLEADS_PORTABLE_SMOKE -ErrorAction SilentlyContinue
            Remove-Item Env:LINKLEADS_TEST_USER_DATA -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        with:
          name: LinkLeads-INSTALADOR-D-LINKLEADS-${{ env.SOURCE_SHA }}
          path: portable-package/
          if-no-files-found: error
          retention-days: 30

  publish-owner-candidate:
    name: Publicar pacote Windows acessivel em Releases (main)
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    needs: portable-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LinkLeads-INSTALADOR-D-LINKLEADS-${{ env.SOURCE_SHA }}
          path: portable-package
      - name: Gerar ZIP final e publicar release de avaliacao
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test -f portable-package/LinkLeads/LinkLeads.exe
          test -f portable-package/INSTALAR-LINKLEADS.cmd
          test -f portable-package/ABRIR-LINKLEADS.cmd
          test -f portable-package/CONTRATO_IDENTIDADE_E_POSTS.md
          grep -Fq 'D:\LINKLEADS' portable-package/LEIA-ME.txt
          # CI verde é necessário. Também impedir publicar commit já ultrapassado.
          latest="$(gh api "repos/${GH_REPO}/branches/main" --jq '.commit.sha')"
          if [[ "$latest" != "$SOURCE_SHA" ]]; then
            echo "Commit substituído; publicação do pacote antigo bloqueada."
            exit 0
          fi
          short="${SOURCE_SHA:0:8}"
          tag="v0.5.11-windows-${short}"
          zipfile="LINKLEADS-INSTALADOR-D-LINKLEADS.zip"
          (
            cd portable-package
            zip -q -r "../${zipfile}" .
          )
          sha256sum "${zipfile}" > "${zipfile}.sha256"
          gh release create "${tag}" "${zipfile}" "${zipfile}.sha256" \
            --target "${SOURCE_SHA}" --latest \
            --title "LINKLEADS 0.5.11 - Instalador Windows D:\LINKLEADS" \
            --notes "UNICO PADRAO WINDOWS: extraia o ZIP, execute INSTALAR-LINKLEADS.cmd na raiz; sempre instala em D:\LINKLEADS e cria atalho no desktop. Sem NSIS, sem backup obrigatorio, sem exclusao de campanhas. Build/EXE/instalacao/atalho/janela homologados em Windows isolado. Operacao em conta LinkedIn real depende de homologacao do proprietario. Este pacote nao e assinado digitalmente."
